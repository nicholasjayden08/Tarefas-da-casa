<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Casa em dia</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap">
    <style>
        :root{--bg:#0e0c15;--surface:#171423;--line:#2a2540;--text:#ece9f5;--muted:#8d87a3;--accent:#8b6cff;--ok:#5fd39a;--danger:#ff6b81}
        *{box-sizing:border-box}
        html,body{margin:0}
        body{background:var(--bg);color:var(--text);font-family:Manrope,system-ui,-apple-system,sans-serif;line-height:1.5;min-height:100vh}
        main{max-width:680px;margin:0 auto;padding:32px 20px 120px}
        h1{font-size:2rem;font-weight:800;margin:0;letter-spacing:-.02em}
        .sub{color:var(--muted);margin:4px 0 20px}
        .progress{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:8px}
        .progress i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .4s}
        .count{font-size:.9rem;color:var(--muted);margin-bottom:28px}
        nav{display:flex;gap:6px;margin-bottom:28px;border-bottom:1px solid var(--line)}
        nav button{background:none;border:0;color:var(--muted);font:inherit;font-weight:600;padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
        nav button[aria-selected=true]{color:var(--text);border-color:var(--accent)}
        h2{font-size:1.05rem;font-weight:600;color:var(--muted);margin:26px 0 10px}
        .task{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
        .check{width:28px;height:28px;flex:none;border-radius:50%;border:2px solid var(--muted);background:none;cursor:pointer;color:#0e0c15;font-size:16px;line-height:1;padding:0}
        .check:hover:not(:disabled){border-color:var(--accent)}
        .done .check{background:var(--ok);border-color:var(--ok);cursor:default}
        .done .name{text-decoration:line-through;color:var(--muted)}
        .info{flex:1;min-width:0}
        .name{font-weight:600}
        .meta{font-size:.85rem;color:var(--muted)}
        .del{background:none;border:0;color:var(--muted);cursor:pointer;font-size:1.1rem;padding:6px;border-radius:8px}
        .del:hover{color:var(--danger)}
        .empty{color:var(--muted);padding:40px 0;text-align:center}
        .totals{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
        .total{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
        .total b{display:block;font-size:2rem;font-weight:800}
        .total span{color:var(--muted);font-size:.9rem}
        .stat{display:grid;grid-template-columns:1fr repeat(3,64px);gap:8px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);font-size:.95rem}
        .stat.head{color:var(--muted);font-size:.8rem;text-align:center}
        .stat.head span:first-child{text-align:left}
        .stat span+span{text-align:center}
        .fab{position:fixed;right:max(20px,calc(50% - 320px));bottom:28px;background:var(--accent);color:#fff;border:0;border-radius:99px;font:inherit;font-weight:700;padding:14px 22px;cursor:pointer;box-shadow:0 8px 24px rgba(139,108,255,.35)}
        dialog{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:18px;padding:24px;width:min(460px,92vw)}
        dialog::backdrop{background:rgba(5,4,10,.7)}
        dialog h3{margin:0 0 16px;font-size:1.25rem}
        label{display:block;font-size:.9rem;color:var(--muted);margin:12px 0 4px}
        input,select{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;color-scheme:dark}
        .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
        .days{display:flex;flex-wrap:wrap;gap:6px}
        .days label{margin:0;display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:6px 12px;cursor:pointer;color:var(--text)}
        .days input{width:auto;accent-color:var(--accent)}
        .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
        .btn{font:inherit;font-weight:600;border-radius:10px;padding:10px 18px;cursor:pointer;border:1px solid var(--line);background:none;color:var(--text)}
        .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
        .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--surface);border:1px solid var(--danger);padding:10px 16px;border-radius:10px;font-size:.9rem}
        .hidden{display:none}
        :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
        @media(prefers-reduced-motion:reduce){*{transition:none!important}}
    </style>
</head>
<body>
<main>
    <h1 id="data"></h1>
    <p class="sub">Suas tarefas da casa</p>
    <div class="progress"><i id="barra"></i></div>
    <div class="count" id="contagem"></div>

    <nav role="tablist">
        <button role="tab" id="tab-hoje" aria-selected="true">Hoje</button>
        <button role="tab" id="tab-stats" aria-selected="false">Estatísticas</button>
    </nav>

    <section id="hoje"></section>
    <section id="stats" class="hidden"></section>
</main>

<button class="fab" id="nova">+ Nova tarefa</button>

<dialog id="dlg">
    <h3>Nova tarefa</h3>
    <div id="f">
        <label for="nome">Nome</label>
        <input id="nome" maxlength="80" placeholder="Ex.: Lavar a louça">
        <label for="comodo">Cômodo</label>
        <input id="comodo" maxlength="40" placeholder="Ex.: Cozinha">
        <div class="row">
            <div>
                <label for="freq">Frequência</label>
                <select id="freq">
                    <option value="DIARIA">Diária</option>
                    <option value="SEMANAL">Semanal</option>
                    <option value="MENSAL">Mensal</option>
                </select>
            </div>
            <div>
                <label for="periodo">Período do dia</label>
                <select id="periodo">
                    <option value="">Qualquer</option>
                    <option value="MANHA">Manhã</option>
                    <option value="TARDE">Tarde</option>
                    <option value="NOITE">Noite</option>
                </select>
            </div>
        </div>
        <div id="boxSemana" class="hidden">
            <label>Dias da semana</label>
            <div class="days" id="dias"></div>
        </div>
        <div id="boxMes" class="hidden">
            <label for="diaMes">Dia do mês</label>
            <input id="diaMes" type="number" min="1" max="31" placeholder="Ex.: 15">
        </div>
        <label for="horario">Horário (opcional)</label>
        <input id="horario" type="time">
        <div class="actions">
            <button class="btn" id="cancelar" type="button">Cancelar</button>
            <button class="btn primary" id="salvar" type="button">Salvar tarefa</button>
        </div>
    </div>
</dialog>

<script>
    const $ = id => document.getElementById(id);
    const DIAS = [["MONDAY","Seg"],["TUESDAY","Ter"],["WEDNESDAY","Qua"],["THURSDAY","Qui"],["FRIDAY","Sex"],["SATURDAY","Sáb"],["SUNDAY","Dom"]];

    function el(tag, cls, text) {
        const e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text != null) e.textContent = text;
        return e;
    }

    async function api(path, opts) {
        const r = await fetch(path, opts);
        if (!r.ok) {
            const msg = r.status === 409 ? "Essa tarefa já foi concluída hoje."
                : r.status === 400 ? "Confira os campos e tente de novo."
                    : "Algo deu errado. Tente de novo.";
            toast(msg);
            throw new Error(r.status);
        }
        return r.status === 204 ? null : r.json();
    }

    function toast(msg) {
        const t = el("div", "toast", msg);
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 3000);
    }

    function taskRow(t) {
        const row = el("div", "task" + (t.feitaHoje ? " done" : ""));
        const check = el("button", "check", t.feitaHoje ? "✓" : "");
        check.setAttribute("aria-label", "Marcar " + t.nome + " como feita");
        check.disabled = t.feitaHoje;
        check.onclick = async () => { await api("/tarefas/" + t.id + "/concluir", { method: "POST" }); carregarHoje(); };
        const info = el("div", "info");
        info.appendChild(el("div", "name", t.nome));
        const meta = [t.comodo, t.horario ? t.horario.slice(0, 5) : null].filter(Boolean).join(" · ");
        if (meta) info.appendChild(el("div", "meta", meta));
        const del = el("button", "del", "✕");
        del.setAttribute("aria-label", "Excluir " + t.nome);
        del.onclick = async () => {
            if (!confirm("Excluir \"" + t.nome + "\" e todo o histórico dela?")) return;
            await api("/tarefas/" + t.id, { method: "DELETE" });
            carregarHoje();
        };
        row.append(check, info, del);
        return row;
    }

    async function carregarHoje() {
        const h = await api("/tarefas/hoje");
        const grupos = [["Manhã", h.manha], ["Tarde", h.tarde], ["Noite", h.noite], ["Ao longo do dia", h.semPeriodo]];
        const box = $("hoje");
        box.replaceChildren();
        const todas = grupos.flatMap(g => g[1]);
        const feitas = todas.filter(t => t.feitaHoje).length;
        $("barra").style.width = todas.length ? (feitas / todas.length * 100) + "%" : "0";
        $("contagem").textContent = todas.length
            ? feitas + " de " + todas.length + " tarefas feitas hoje"
            : "";
        if (!todas.length) {
            box.appendChild(el("div", "empty", "Nenhuma tarefa para hoje. Toque em “Nova tarefa” para começar."));
            return;
        }
        grupos.forEach(([titulo, lista]) => {
            if (!lista.length) return;
            box.appendChild(el("h2", null, titulo));
            lista.forEach(t => box.appendChild(taskRow(t)));
        });
    }

    async function carregarStats() {
        const s = await api("/estatisticas");
        const box = $("stats");
        box.replaceChildren();
        const totals = el("div", "totals");
        [[s.totalSemana, "feitas nesta semana"], [s.totalMes, "feitas neste mês"]].forEach(([n, l]) => {
            const c = el("div", "total");
            c.append(el("b", null, String(n)), el("span", null, l));
            totals.appendChild(c);
        });
        box.appendChild(totals);
        if (!s.tarefas.length) { box.appendChild(el("div", "empty", "Ainda não há tarefas cadastradas.")); return; }
        const head = el("div", "stat head");
        ["Tarefa", "Semana", "Mês", "Dias seguidos"].forEach(x => head.appendChild(el("span", null, x)));
        box.appendChild(head);
        s.tarefas.forEach(t => {
            const r = el("div", "stat");
            [t.nome, t.vezesNaSemana, t.vezesNoMes, t.sequenciaDias].forEach(x => r.appendChild(el("span", null, String(x))));
            box.appendChild(r);
        });
    }

    function aba(qual) {
        const hoje = qual === "hoje";
        $("hoje").classList.toggle("hidden", !hoje);
        $("stats").classList.toggle("hidden", hoje);
        $("tab-hoje").setAttribute("aria-selected", hoje);
        $("tab-stats").setAttribute("aria-selected", !hoje);
        hoje ? carregarHoje() : carregarStats();
    }
    $("tab-hoje").onclick = () => aba("hoje");
    $("tab-stats").onclick = () => aba("stats");

    DIAS.forEach(([v, l]) => {
        const lab = el("label");
        const cb = document.createElement("input");
        cb.type = "checkbox"; cb.value = v;
        lab.append(cb, document.createTextNode(l));
        $("dias").appendChild(lab);
    });

    function ajustaForm() {
        $("boxSemana").classList.toggle("hidden", $("freq").value !== "SEMANAL");
        $("boxMes").classList.toggle("hidden", $("freq").value !== "MENSAL");
    }
    $("freq").onchange = ajustaForm;
    $("nova").onclick = () => {
        ["nome", "comodo", "diaMes", "horario"].forEach(i => $(i).value = "");
        $("freq").value = "DIARIA"; $("periodo").value = "";
        $("dias").querySelectorAll("input").forEach(c => c.checked = false);
        ajustaForm();
        $("dlg").showModal();
        $("nome").focus();
    };
    $("cancelar").onclick = () => $("dlg").close();
    $("salvar").onclick = async () => {
        const nome = $("nome").value.trim();
        if (!nome) { toast("Dê um nome para a tarefa."); return; }
        const body = {
            nome,
            comodo: $("comodo").value.trim() || null,
            frequencia: $("freq").value,
            periodoDoDia: $("periodo").value || null,
            horario: $("horario").value || null,
            diasDaSemana: [...$("dias").querySelectorAll("input:checked")].map(c => c.value),
            diaDoMes: $("freq").value === "MENSAL" && $("diaMes").value ? Number($("diaMes").value) : null
        };
        await api("/tarefas", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
        $("dlg").close();
        aba("hoje");
    };

    const dataHoje = new Date().toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long" });
$("data").textContent = dataHoje.charAt(0).toUpperCase() + dataHoje.slice(1);
    carregarHoje();
</script>
</body>
</html>
